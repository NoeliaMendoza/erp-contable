# Revisa que cada PR diga qué tarea cierra ("Closes #n"), para que la tarea se cierre sola
# al fusionar y el tablero del proyecto se actualice. No descarga ni ejecuta código del PR.
name: PR vinculado a tarea

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pr-tarea-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tarea:
    name: Tarea vinculada
    runs-on: ubuntu-latest
    steps:
      - name: Revisar la descripción del PR
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- bot:tarea-vinculada -->';
            // PR que no corresponde a ninguna tarea (corrección urgente, CI): se exime con esta etiqueta.
            const SKIP_LABEL = 'sin tarea';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            // Los PR desde forks reciben un token de solo lectura: ahí solo se informa en el check.
            const canComment = pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`;

            // Se ignoran los comentarios HTML de la plantilla (<!-- ... -->).
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const numbers = (re) => [...body.matchAll(re)].map((m) => Number(m[1]));
            const closing = numbers(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)\b/gi);
            const refs = numbers(/\b(?:refs?|parte de):?\s+#(\d+)\b/gi);
            const spanish = /\b(?:cierra|cierre|resuelve|soluciona|corrige):?\s+#\d+/i.test(body);

            async function findComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              return comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(MARKER));
            }

            async function clearComment() {
              if (!canComment) return;
              const existing = await findComment();
              if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            }

            async function report(text) {
              if (canComment) {
                const commentBody = `${MARKER}\n${text}`;
                const existing = await findComment();
                if (existing) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: commentBody });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: commentBody });
                }
              }
              core.setFailed(text.replace(/\*\*/g, ''));
            }

            if (pr.labels.some((l) => l.name === SKIP_LABEL)) {
              core.notice(`El PR tiene la etiqueta "${SKIP_LABEL}": no se exige tarea.`);
              await clearComment();
              return;
            }

            // Comprueba que los números apunten a tareas (issues) de este repositorio y no a PRs.
            const invalid = [];
            for (const n of new Set([...closing, ...refs])) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: n });
                if (data.pull_request) invalid.push(`#${n} es un PR, no una tarea`);
              } catch (error) {
                if (error.status === 404) invalid.push(`#${n} no existe en este repositorio`);
                else throw error;
              }
            }
            if (invalid.length > 0) {
              await report(`**El PR menciona una tarea que no es válida:** ${invalid.join('; ')}.\n\n` +
                'Corrige el número en la descripción del PR (por ejemplo `Closes #15`).');
              return;
            }

            if (closing.length > 0) {
              core.notice(`Al fusionar se cerrará: ${closing.map((n) => `#${n}`).join(', ')}.`);
              await clearComment();
              return;
            }

            // PR parcial: solo enlaza la tarea, que queda abierta.
            if (refs.length > 0) {
              core.warning(`El PR solo referencia ${refs.map((n) => `#${n}`).join(', ')}: la tarea NO se cerrará sola al fusionar.`);
              await clearComment();
              return;
            }

            const hint = spanish
              ? '\n\nOjo: GitHub no entiende **"Cierra"**; la palabra tiene que ir en inglés: `Closes #15`.'
              : '';
            await report(
              '**Este PR no dice qué tarea cierra.** Agrega en la descripción una línea como:\n\n' +
              '```\nCloses #15\n```\n' +
              'Así la tarea se cierra sola al fusionar y el tablero se actualiza.' + hint + '\n\n' +
              '- Si el PR es solo una parte de la tarea, usa `Refs #15` (la tarea queda abierta).\n' +
              `- Si no corresponde a ninguna tarea (por ejemplo, una corrección urgente o CI), agrega la etiqueta \`${SKIP_LABEL}\`.`);
